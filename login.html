<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TravelEase | Sign In to Manage Your Trips</title>
  <meta name="description" content="Sign in to your TravelEase account to manage flights, train tickets, hotel stays, and custom holiday bookings.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="back-home-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="m15 18-6-6 6-6"></path></svg>
        Back to TravelEase Home
      </a>

      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <span class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
            </svg>
          </span>
          Travel<span style="color:var(--sky-blue)">Ease</span>
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage itineraries, track tickets, and unlock member discounts.</p>
      </div>

      <form class="auth-form" id="login-form">
        <div class="auth-field">
          <label class="auth-label">Email Address</label>
          <input type="email" class="auth-input" placeholder="name@example.com" required value="traveler@example.com">
        </div>

        <div class="auth-field">
          <label class="auth-label">Password</label>
          <div class="auth-input-group">
            <input type="password" class="auth-input" placeholder="••••••••" required value="TravelPass123!">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label class="remember-me">
            <input type="checkbox" checked>
            <span>Remember me for 30 days</span>
          </label>
          <a href="#" class="forgot-link" onclick="window.showToast('Password reset link sent to your email!', 'info'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="auth-submit-btn">
          Log In
        </button>
      </form>

      <div class="auth-divider">
        <span>Or continue with</span>
      </div>

      <div class="social-login-grid">
        <button type="button" class="social-btn" onclick="window.showToast('Connecting with Google...', 'info')">
          <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
          Google
        </button>
        <button type="button" class="social-btn" onclick="window.showToast('Connecting with Apple...', 'info')">
          <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.65-.97 1.7-0.85 2.72.99.08 2.02-.53 2.56-1.22z"/></svg>
          Apple
        </button>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create free account</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
