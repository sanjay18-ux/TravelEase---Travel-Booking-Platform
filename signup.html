<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — TravelEase | Create Your Free Travel Account</title>
  <meta name="description" content="Create a free TravelEase account. Unlock member rates on flights, hotels, holiday packages, and manage your journeys easily.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="back-home-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="m15 18-6-6 6-6"></path></svg>
        Back to TravelEase Home
      </a>

      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <span class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
            </svg>
          </span>
          Travel<span style="color:var(--sky-blue)">Ease</span>
        </a>
        <h1 class="auth-title">Create Free Account</h1>
        <p class="auth-subtitle">Join over 1.2M travelers and unlock instant cashback and member fares.</p>
      </div>

      <form class="auth-form" id="signup-form">
        <div class="auth-field">
          <label class="auth-label">Full Name</label>
          <input type="text" class="auth-input" placeholder="e.g. Alex Henderson" required>
        </div>

        <div class="auth-field">
          <label class="auth-label">Email Address</label>
          <input type="email" class="auth-input" placeholder="alex@example.com" required>
        </div>

        <div class="auth-field">
          <label class="auth-label">Mobile Number</label>
          <input type="tel" class="auth-input" placeholder="+1 (555) 000-0000" required>
        </div>

        <div class="auth-field">
          <label class="auth-label">Create Password</label>
          <div class="auth-input-group">
            <input type="password" id="signup-password" class="auth-input" placeholder="At least 8 characters" required minlength="8">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label">Confirm Password</label>
          <div class="auth-input-group">
            <input type="password" id="signup-confirm-password" class="auth-input" placeholder="Confirm password" required minlength="8">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <label class="remember-me" style="font-size:0.8125rem;">
          <input type="checkbox" required checked>
          <span>I agree to TravelEase <a href="contact.html#terms" style="color:var(--sky-blue); font-weight:600;">Terms</a> and <a href="contact.html#privacy" style="color:var(--sky-blue); font-weight:600;">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="auth-submit-btn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In here</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
